// scenario_stress.cfg — frozen automated CPU stress scenario (2026-09-04).
//
// What: solo 6v6 bot match on dl_midtown, no human input. The engine's own
// practice-bot machinery (same convars as the in-game Practice vs Bots mode,
// see game/citadel/cfg/citadel_botmatch_practice_6v6.cfg and
// https://deadlock.wiki/Console_commands#Adding_Bots) spawns 12 bots at game
// start; creeps, abilities and teamfights provide the CPU load.
//
// How: run_once.sh appends this file to autoexec_lab.cfg when BENCH_SCENARIO
// names it, and launches with +exec autoexec_lab +map <BENCH_MAP>. convars
// are set at startup, the map load starts the match, bots spawn themselves.
// Frozen for every case: scenario differences must come from the matrix
// variable, never from here.
//
// Tuning: pregame countdown shortened to 5s so the 30s sample window lands
// in action, not countdown (SETTLE_SECS=45 covers map load + countdown).
citadel_solo_bot_match 1
citadel_active_lane 0
citadel_spawn_practice_bots 1
citadel_spawn_practice_bots_count 12
citadel_bot_attack_enemies 1
citadel_server_all_players_disconnected_grace_period_s 20
citadel_pregame_duration 5
host_timescale 1
