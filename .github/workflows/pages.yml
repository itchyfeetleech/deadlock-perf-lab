name: Publish community results
on:
  push:
    branches: [main]
    paths:
      - 'cvar-impact.html'
      - 'cvar-impact.png'
      - 'particle-values.html'
      - 'results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public results
        run: |
          mkdir -p _site/results
          cp cvar-impact.html _site/index.html
          cp cvar-impact.html cvar-impact.png particle-values.html _site/
          cp results/* _site/results/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
